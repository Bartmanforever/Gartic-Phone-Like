<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scrum Phone - Mario Kart Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="timer-container" class="hidden">
        <div id="turn-counter">TOUR 0 / 0</div>
        <div id="timer-display">--</div>
        <div id="timer-bar"><div id="timer-progress"></div></div>
    </div>

    <div class="container">
        <h1>SCRUM PHONE</h1>

        <div id="screen-login">
            <div class="login-grid">
                <div class="login-card">
                    <h2>🏁 JOUEUR</h2>
                    <input type="text" id="login-name" placeholder="TON PRÉNOM">
                    <button id="btn-player-join">REJOINDRE</button>
                </div>
                <div class="login-card" style="border-color: var(--mk-red);">
                    <h2>🏆 ADMIN</h2>
                    <input type="text" id="admin-name" placeholder="TON PRÉNOM">
                    <input type="password" id="admin-pass" placeholder="CODE">
                    <button id="btn-admin-join" class="btn-admin">HOST</button>
                </div>
            </div>
        </div>

        <div id="screen-lobby" class="hidden">
            <div id="player-list" style="font-size: 1.8rem; color: var(--mk-yellow); margin: 20px;"></div>
            <p>En attente du départ...</p>
        </div>

        <div id="screen-game" class="hidden">
            <h2 id="game-title" style="color: var(--mk-yellow)"></h2>
            <p id="game-instruction" style="font-size: 1.1rem; margin: 10px 0;"></p>

            <div id="zone-write" class="hidden">
                <input type="text" id="input-write" placeholder="Ton idée...">
                <br><button id="btn-submit-write">VALIDER</button>
            </div>

            <div id="zone-draw" class="hidden">
                <div id="canvas-container"><canvas id="paintCanvas" width="600" height="400"></canvas></div>
                <div class="toolbar">
                    <div id="palette" style="display: flex; gap: 6px;"></div>
                    <button id="btn-eraser" style="background: #fff; color: #000; border: 1px solid #000; border-radius: 5px; padding: 5px 10px;">🧼 GOMME</button>
                    <button id="btn-clear-canvas" style="background:#666; color:white; border-radius: 5px; padding: 5px 10px;">EFFACER</button>
                </div>
                <button id="btn-submit-draw" style="background: var(--mk-red);">TERMINÉ !</button>
            </div>

            <div id="zone-guess" class="hidden">
                <div style="background: #fff; padding: 10px; border-radius: 15px; margin-bottom: 10px; border: 4px solid var(--mk-blue);">
                    <img id="img-to-guess" class="result-img" src="" alt="Dessin à deviner">
                </div>
                <input type="text" id="input-guess" placeholder="Ta réponse...">
                <br><button id="btn-submit-guess">ENVOYER</button>
            </div>
        </div>

        <div id="screen-wait" class="hidden">
            <h2 id="wait-message">BIEN JOUÉ !</h2>
            <p id="wait-subtext">Attente des autres joueurs...</p>
            <div id="wait-icon" style="font-size: 4rem;">🏎️💨</div>
        </div>

        <div id="screen-results" class="hidden">
            <h2>🏆 RÉSULTATS 🏆</h2>
            <div id="results-gallery"></div>
        </div>
    </div>

    <div id="persistent-admin-panel" class="hidden">
        <span class="admin-label">Admin:</span>
        <div id="admin-setup-tools">
            <input type="number" id="cfg-timer" value="60" style="width:45px; padding:5px; margin:0;">
            <button id="btn-start-game" class="btn-admin">START</button>
        </div>
        <button id="btn-admin-view-results" class="hidden" style="background: var(--mk-blue);">RÉSULTATS</button>
        <button id="btn-replay-game" style="background: #28a745;">REJOUER</button>
        <button id="btn-reset-all" style="background:#000; color:white; padding: 8px 12px;">RESET</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
